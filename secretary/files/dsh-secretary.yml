- id: secretary-mcp-readonly
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: secretary
    transport: stdio
    command: /usr/bin/python3
    args: [/opt/secretary/secretary.py, mcp]
    toolCallTimeoutMs: 120000
- id: secretary-mcp-tools
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: secretary_tools
    transport: stdio
    command: /usr/bin/python3
    args: [/opt/secretary/secretary-tools.py, mcp]
    toolCallTimeoutMs: 120000
